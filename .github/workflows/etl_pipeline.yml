
name: dummy pipeline

on: [push]

jobs:
  run-all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Run ETL
        run: python etl/scripts/etl.py

      - name: Run Pytest
        run: pytest etl/scripts/test_etl.py

      - name: Run dbt
        working-directory: ./etl/dbt_project
        run: |
          dbt deps
          dbt run --profiles-dir .
          dbt test --profiles-dir .
